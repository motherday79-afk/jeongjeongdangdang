<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>정참시 Name Pulse 테스트</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:1050px;margin:40px auto;padding:0 18px;background:#f7f8fb;color:#111}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 28px #0000000a}button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;margin-right:8px}.ok{color:#0a7b48;font-weight:800}.bad{color:#b42318;font-weight:800}.muted{color:#667085}pre{white-space:pre-wrap;word-break:break-word;background:#0f172a;color:#e2e8f0;padding:16px;border-radius:12px;min-height:90px;max-height:520px;overflow:auto}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:10px 8px;border-bottom:1px solid #e5e7eb;text-align:right;font-size:14px}th:first-child,td:first-child{text-align:left}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2ff;font-weight:800}.summary{font-weight:800;margin-top:10px}
</style></head>
<body>
<h1>정참시 · Name Pulse 검증</h1>
<p class="muted">관리자 로그인 없이 NAVER Search Ads 연결과 고정 검증군만 확인합니다. NOW Rank에는 반영하지 않습니다.</p>
<div class="card"><h2>1. 환경변수 확인</h2><button onclick="runSimple('/api/name-pulse-test?mode=health','health')">Health 확인</button><div id="healthState"></div><pre id="health">대기 중</pre></div>
<div class="card"><h2>2. 한동훈 1건 확인</h2><button onclick="runSimple('/api/name-pulse-test?mode=probe','probe')">Name Pulse 호출</button><div id="probeState"></div><pre id="probe">대기 중</pre></div>
<div class="card"><h2>3. 6명 검증군 일괄 비교</h2><p class="muted">김민석 · 정청래 · 한동훈 · 서미화 · 김종민 · 천하람</p><button onclick="runBenchmark()">6명 Benchmark 실행</button><div id="benchmarkState"></div><div id="benchmarkTable"></div><pre id="benchmark">대기 중</pre></div>
<script>
async function getJson(url){const r=await fetch(url,{cache:'no-store'});const j=await r.json().catch(()=>({error:'JSON 응답 아님'}));return {r,j}}
async function runSimple(url,id){const out=document.getElementById(id),st=document.getElementById(id+'State');out.textContent='호출 중...';st.textContent='';try{const {r,j}=await getJson(url);out.textContent=JSON.stringify(j,null,2);st.innerHTML=`<p class="${r.ok?'ok':'bad'}">HTTP ${r.status} · ${r.ok?'응답 성공':'응답 실패'}</p>`}catch(e){out.textContent=String(e);st.innerHTML='<p class="bad">브라우저 호출 실패</p>'}}
function n(v){return Number(v||0).toLocaleString('ko-KR')}
async function runBenchmark(){const out=document.getElementById('benchmark'),st=document.getElementById('benchmarkState'),tbl=document.getElementById('benchmarkTable');out.textContent='6명 동시 호출 중...';st.textContent='';tbl.innerHTML='';try{const {r,j}=await getJson('/api/name-pulse-test?mode=benchmark');out.textContent=JSON.stringify(j,null,2);st.innerHTML=`<p class="${r.ok?'ok':'bad'}">HTTP ${r.status} · ${r.ok?'응답 성공':'응답 실패'}</p>`;if(Array.isArray(j.results)){const rows=j.results.map(x=>`<tr><td>${x.keyword||'-'}</td><td>${n(x.monthlyPcQcCnt)}</td><td>${n(x.monthlyMobileQcCnt)}</td><td><b>${n(x.monthlyTotalQcCnt)}</b></td><td>${n(x.referenceMonthlyTotalQcCnt)}</td><td>${x.deltaPct==null?'-':x.deltaPct.toFixed(2)+'%'}</td><td><span class="pill">${x.verdict||'-'}</span></td></tr>`).join('');tbl.innerHTML=`<div class="summary">성공 ${j.succeeded||0}/${j.benchmarkCount||0} · MATCH ${j.summary?.match||0} · CLOSE ${j.summary?.close||0} · CHECK ${j.summary?.check||0}</div><table><thead><tr><th>이름</th><th>PC</th><th>Mobile</th><th>합계</th><th>기준값</th><th>차이</th><th>판정</th></tr></thead><tbody>${rows}</tbody></table>`}}catch(e){out.textContent=String(e);st.innerHTML='<p class="bad">브라우저 호출 실패</p>'}}
</script></body></html>
