<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>정정당당 Name Pulse 테스트</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:900px;margin:40px auto;padding:0 18px;background:#f7f8fb;color:#111}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 28px #0000000a}button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;margin-right:8px}pre{white-space:pre-wrap;word-break:break-word;background:#0f172a;color:#e2e8f0;padding:16px;border-radius:12px;min-height:90px}.ok{color:#0a7b48;font-weight:800}.bad{color:#b42318;font-weight:800}</style></head><body><h1>정정당당 · Name Pulse 테스트</h1><p>관리자 로그인 없이 Search Ads 환경변수와 고정 키워드 1건 호출만 확인합니다. NOW Rank에는 반영하지 않습니다.</p><div class="card"><h2>1. 환경변수 확인</h2><button onclick="run('/api/name-pulse-health','health')">Health 확인</button><div id="healthState"></div><pre id="health">대기 중</pre></div><div class="card"><h2>2. 한동훈 1건 검색량 확인</h2><button onclick="run('/api/name-pulse-probe','probe')">Name Pulse 호출</button><div id="probeState"></div><pre id="probe">대기 중</pre></div><script>async function run(url,id){const out=document.getElementById(id), st=document.getElementById(id+'State');out.textContent='호출 중...';st.textContent='';try{const r=await fetch(url,{cache:'no-store'});const j=await r.json().catch(()=>({error:'JSON 응답 아님'}));out.textContent=JSON.stringify(j,null,2);st.innerHTML=`<p class="${r.ok?'ok':'bad'}">HTTP ${r.status} · ${r.ok?'응답 성공':'응답 실패'}</p>`}catch(e){out.textContent=String(e);st.innerHTML='<p class="bad">브라우저 호출 실패</p>'}}</script></body></html>
